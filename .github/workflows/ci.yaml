# BEGIN AI USAGE SECTION
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the lockfile pins onnxruntime-web@1.17.3 (required by
      # @imgly/background-removal-data) against a newer peer range,
      # so a plain `npm ci` refuses to install
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build extension
        run: npm run build

      # non-blocking until the in-progress code in src/sandbox is finished
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

# END AI USAGE SECTION